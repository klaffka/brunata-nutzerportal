name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "brunata-nutzerportal-api==0.3.0"
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Syntax check
        run: python -m compileall -q custom_components main.py test

      - name: JSON + manifest validation
        run: |
          python - <<'EOF'
          import json, pathlib
          base = pathlib.Path("custom_components/brunata_nutzerportal")
          files = [base / "manifest.json", base / "strings.json", pathlib.Path("hacs.json")]
          files += sorted((base / "translations").glob("*.json"))
          for p in files:
              json.loads(p.read_text())
          m = json.loads((base / "manifest.json").read_text())
          for field in ("domain", "name", "version", "documentation", "codeowners", "requirements"):
              assert field in m, f"manifest missing {field}"
          assert m["domain"] == "brunata_nutzerportal"
          print("JSON + manifest OK:", m["version"])
          EOF

      - name: Coordinator logic tests
        run: python test/test_coordinator_logic.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Fetch hassfest (home-assistant/core, pinned to HA release)
        run: |
          git clone --depth 1 --branch 2026.8.3 --filter=blob:none --sparse \
            https://github.com/home-assistant/core /tmp/ha-core
          cd /tmp/ha-core
          git sparse-checkout set script

      - name: Install hassfest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "homeassistant==2026.8.3" infrared-protocols tqdm ruff

      - name: Run hassfest
        run: |
          cd /tmp/ha-core
          python -m script.hassfest \
            --integration-path "$GITHUB_WORKSPACE/custom_components/brunata_nutzerportal"