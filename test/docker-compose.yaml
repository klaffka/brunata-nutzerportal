services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped

    # macOS: host networking geht nicht zuverlässig -> normales Port-Mapping
    ports:
      - "8123:8123"

    environment:
      - TZ=Europe/Berlin

    volumes:
      # Persistente HA-Konfiguration auf deinem Host
      - ./ha-config:/config
      # Integration (Single Source of Truth im Repo-Root, HACS-Layout)
      - ../custom_components:/config/custom_components